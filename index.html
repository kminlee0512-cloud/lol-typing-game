<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LoL Typing Game</title>
<style>
:root{--bg:#010a13;--panel:#091a28;--line:#2c4a5a;--teal:#0ac8b9;--gold:#c8aa6e;--tx:#f0e6d2;--mut:#7fa0a8;--ok:#5be3b0;--bad:#ff6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{font-size:min(1vw,1.7778vh);height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{height:100%;background:var(--bg);color:var(--tx);font-family:Pretendard,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;display:grid;place-items:center;overflow:hidden;user-select:none}
#stage{width:100rem;height:56.25rem;position:relative;overflow:hidden;border-radius:1rem;border:.2rem solid #3a3220;background:radial-gradient(ellipse at 50% 0%,#0f4552 0%,#0a2433 45%,#030f1a 100%)}
#stage:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(60deg,rgba(200,170,110,.035) 0 .15rem,transparent .15rem 7rem);pointer-events:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;padding:4rem 6rem}
.screen.on{display:flex}
h1{font-size:5rem;letter-spacing:.04em;font-weight:900;color:var(--gold)}
h1 span{color:var(--teal)}
.sub{color:var(--mut);font-size:1.7rem;margin-top:.8rem}
.info{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6rem;margin:3.6rem 0;width:100%}
.info div{background:var(--panel);border:.2rem solid var(--line);border-radius:.6rem;padding:2.2rem;text-align:left;font-size:1.6rem;color:var(--mut);line-height:1.5}
.info b{display:block;font-size:2.6rem;color:var(--gold);margin-bottom:.4rem}
.btn{font:inherit;font-weight:800;font-size:2.2rem;padding:1.3rem 5rem;border:.2rem solid var(--gold);border-radius:.5rem;background:linear-gradient(#d8bc80,#a98a4c);color:#0a1420;cursor:pointer;transition:transform .1s}
.btn:hover{transform:scale(1.05)}
.btn.ghost{background:transparent;color:var(--tx);border-color:var(--line)}
.hint{color:var(--mut);font-size:1.4rem;margin-top:1.8rem}
#play{padding-top:3rem}
.top{display:flex;width:100%;gap:1.6rem;align-items:stretch}
.stat{flex:1;background:var(--panel);border:.15rem solid var(--line);border-radius:.6rem;padding:1rem 1.6rem;text-align:center}
.stat small{display:block;color:var(--mut);font-size:1.3rem}
.stat div{font-size:2.8rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat div.low{color:var(--bad)}
.quit{align-self:center;font-size:1.4rem;padding:.8rem 1.6rem}
.bar{width:100%;height:.8rem;background:var(--panel);border-radius:1rem;margin-top:1.6rem;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:var(--teal)}
.card{width:100%;margin-top:3rem;background:var(--panel);border:.2rem solid var(--line);border-radius:.8rem;padding:3rem 2rem;text-align:center}
.card small{color:var(--mut);font-size:1.5rem}
#tg{font-size:6rem;font-weight:900;margin:1.2rem 0 2rem;white-space:pre;min-height:8rem}
#tg span{color:#5d7c86}#tg .ok{color:var(--ok)}#tg .bad{color:var(--bad)}#tg .cur{color:var(--gold);text-decoration:underline}
#ty{font-size:4rem;font-weight:700;white-space:pre;min-height:6rem;border-top:.15rem dashed var(--line);padding-top:1.4rem}
#ty .bad{color:var(--bad)}#ty .cur{text-decoration:underline;color:var(--gold)}
.caret{display:inline-block;width:.3rem;height:4rem;background:var(--teal);vertical-align:middle;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}
#nx{margin-top:2.4rem;color:var(--mut);font-size:1.9rem}
#nx b{color:var(--tx);margin:0 1rem;font-weight:600}
.res{display:grid;grid-template-columns:repeat(5,1fr);gap:1.4rem;width:100%;margin:3.4rem 0}
.res .stat{padding:2rem 1rem}.res .stat div{font-size:3.6rem;color:var(--gold)}
.ver{position:absolute;right:1.4rem;bottom:1rem;font-size:1.2rem;color:var(--mut);opacity:.8}
</style>
</head>
<body>
<div id="stage">
 <section id="lobby" class="screen on">
  <h1>LoL <span>Typing</span> Game</h1>
  <p class="sub">60초 안에 챔피언 이름을 가장 많이 입력하세요</p>
  <div class="info">
   <div><b>60초</b>첫 글자를 입력하는 순간 타이머가 시작됩니다</div>
   <div><b>Enter / Space</b>이름을 다 쓰고 누르면 다음 챔피언으로 넘어갑니다</div>
   <div><b>백스페이스</b>누를 때마다 오타 1회로 기록됩니다</div>
  </div>
  <button class="btn" id="go">게임 시작</button>
  <p class="hint">Enter로도 시작할 수 있어요 · 플레이 중 Esc로 나가기</p>
 </section>
 <section id="play" class="screen">
  <div class="top">
   <button class="btn ghost quit" id="quit">← 나가기</button>
   <div class="stat"><small>남은 시간</small><div id="sT">60.0s</div></div>
   <div class="stat"><small>타수 (타/분)</small><div id="sC">0</div></div>
   <div class="stat"><small>오타</small><div id="sE">0</div></div>
   <div class="stat"><small>완성</small><div id="sP">0</div></div>
  </div>
  <div class="bar"><i id="pb"></i></div>
  <div class="card"><small id="tl">첫 글자를 입력하면 시작됩니다</small><div id="tg"></div><div id="ty"></div></div>
  <div id="nx"></div>
 </section>
 <section id="result" class="screen">
  <h1>⚔ <span>결과</span></h1>
  <p class="sub" id="rs"></p>
  <div class="res" id="res"></div>
  <div style="display:flex;gap:1.6rem"><button class="btn" id="again">다시 하기</button><button class="btn ghost" id="home">홈으로</button></div>
 </section>
 <div class="ver">v0.1</div>
</div>
<script>
const CHAMPS="가렌,갈리오,갱플랭크,그라가스,그레이브즈,그웬,나르,나미,나서스,나피리,노틸러스,녹턴,누누와 윌럼프,니달리,니코,닐라,다리우스,다이애나,드레이븐,라이즈,라칸,람머스,럭스,럼블,레나타 글라스크,레넥톤,레오나,렉사이,렐,렝가,로크,루시안,룰루,르블랑,리 신,리븐,리산드라,릴리아,마스터 이,마오카이,말자하,말파이트,멜,모데카이저,모르가나,문도 박사,미스 포츈,밀리오,바드,바루스,바이,베이가,베인,벡스,벨베스,벨코즈,볼리베어,브라움,브라이어,브랜드,블라디미르,블리츠크랭크,비에고,빅토르,뽀삐,사미라,사이온,사일러스,샤코,세나,세라핀,세주아니,세트,소나,소라카,쉔,쉬바나,스몰더,스웨인,스카너,시비르,신 짜오,신드라,신지드,쓰레쉬,아리,아무무,아우렐리온 솔,아이번,아지르,아칼리,아크샨,아트록스,아펠리오스,알리스타,암베사,애니,애니비아,애쉬,야스오,에코,엘리스,오공,오로라,오른,오리아나,올라프,요네,요릭,우디르,우르곳,워윅,유나라,유미,이렐리아,이블린,이즈리얼,일라오이,자르반 4세,자야,자이라,자크,자헤,잔나,잭스,제드,제라스,제리,제이스,조이,직스,진,질리언,징크스,초가스,카르마,카밀,카사딘,카서스,카시오페아,카이사,카직스,카타리나,칼리스타,케넨,케이틀린,케인,케일,코그모,코르키,퀸,크산테,클레드,키아나,킨드레드,타릭,탈론,탈리야,탐 켄치,트런들,트리스타나,트린다미어,트위스티드 페이트,트위치,티모,파이크,판테온,피들스틱,피오라,피즈,하이머딩거,헤카림,흐웨이".split(",");
const DUR=60;
const $=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

// ---- 한글 조합기 (물리 키 기반 두벌식) ----
const K={KeyQ:"ㅂㅃ",KeyW:"ㅈㅉ",KeyE:"ㄷㄸ",KeyR:"ㄱㄲ",KeyT:"ㅅㅆ",KeyY:"ㅛ",KeyU:"ㅕ",KeyI:"ㅑ",KeyO:"ㅐㅒ",KeyP:"ㅔㅖ",KeyA:"ㅁ",KeyS:"ㄴ",KeyD:"ㅇ",KeyF:"ㄹ",KeyG:"ㅎ",KeyH:"ㅗ",KeyJ:"ㅓ",KeyK:"ㅏ",KeyL:"ㅣ",KeyZ:"ㅋ",KeyX:"ㅌ",KeyC:"ㅊ",KeyV:"ㅍ",KeyB:"ㅠ",KeyN:"ㅜ",KeyM:"ㅡ"};
const L=[..."ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ"],V=[..."ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ"],T=["",..."ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ"];
const VC={"ㅗㅏ":"ㅘ","ㅗㅐ":"ㅙ","ㅗㅣ":"ㅚ","ㅜㅓ":"ㅝ","ㅜㅔ":"ㅞ","ㅜㅣ":"ㅟ","ㅡㅣ":"ㅢ"};
const TC={"ㄱㅅ":"ㄳ","ㄴㅈ":"ㄵ","ㄴㅎ":"ㄶ","ㄹㄱ":"ㄺ","ㄹㅁ":"ㄻ","ㄹㅂ":"ㄼ","ㄹㅅ":"ㄽ","ㄹㅌ":"ㄾ","ㄹㅍ":"ㄿ","ㄹㅎ":"ㅀ","ㅂㅅ":"ㅄ"};
const TS={};for(const k in TC)TS[TC[k]]=[k[0],k[1]];
let cm,l,v,t;
const rend=()=>!l&&!v?"":!v?l:!l?v:String.fromCharCode(0xAC00+(L.indexOf(l)*21+V.indexOf(v))*28+T.indexOf(t));
const commit=()=>{cm+=rend();l=v=null;t=""};
const reset=()=>{cm="";l=v=null;t=""};
function put(j){
 if(L.includes(j)||T.includes(j)){
  if(!l&&!v)l=j;
  else if(!v||!l){commit();l=j}
  else if(!t){if(T.includes(j))t=j;else{commit();l=j}}
  else{const c=TC[t+j];if(c)t=c;else{commit();l=j}}
 }else{
  if(!v)v=j;
  else if(!t){const c=VC[v+j];if(c)v=c;else{commit();v=j}}
  else{let b;if(TS[t]){b=TS[t][1];t=TS[t][0]}else{b=t;t=""}commit();l=b;v=j}
 }
}

// ---- 게임 상태 ----
let scr="lobby",idx=0,keys=0,typos=0,st=0,iv=0,target="",Q=[];
const show=s=>{scr=s;["lobby","play","result"].forEach(x=>$(x).classList.toggle("on",x===s));document.activeElement&&document.activeElement.blur()};
const txt=()=>cm+rend();
function start(){
 Q=shuffle(CHAMPS).concat(shuffle(CHAMPS));
 idx=0;keys=0;typos=0;st=0;clearInterval(iv);reset();
 $("tl").textContent="첫 글자를 입력하면 시작됩니다";
 $("sT").textContent=DUR.toFixed(1)+"s";$("sT").classList.remove("low");$("sC").textContent="0";$("pb").style.width="100%";
 show("play");draw();
}
function tick(){
 const e=(performance.now()-st)/1000,r=Math.max(0,DUR-e);
 $("sT").textContent=r.toFixed(1)+"s";$("sT").classList.toggle("low",r<10);
 $("sC").textContent=e>=1?Math.round(keys/e*60):0;
 $("pb").style.width=r/DUR*100+"%";
 if(r<=0)finish();
}
function begin(){if(!st){st=performance.now();$("tl").textContent="챔피언 이름을 입력하세요";iv=setInterval(tick,100)}}
function draw(){
 target=Q[idx];const tx=txt(),comp=rend()?tx.length-1:-1;
 $("tg").innerHTML=[...target].map((c,i)=>{const x=tx[i];const k=x===undefined?"":x===c?"ok":i===comp?"cur":"bad";return `<span class="${k}">${c===" "?"&nbsp;":c}</span>`}).join("");
 $("ty").innerHTML=[...tx].map((c,i)=>{const k=i===comp&&c!==target[i]?"cur":c!==target[i]?"bad":"";return `<span class="${k}">${c===" "?" ":c}</span>`}).join("")+'<span class="caret"></span>';
 $("sE").textContent=typos;$("sP").textContent=idx;
 $("nx").innerHTML="다음 → "+Q.slice(idx+1,idx+4).map(n=>`<b>${n}</b>`).join("");
}
function next(){idx++;reset();draw()}
function finish(){
 if(scr!=="play")return;
 clearInterval(iv);
 const cpm=Math.round(keys/DUR*60),acc=keys?Math.max(0,(keys-typos)/keys*100):0;
 const box=(a,b)=>`<div class="stat"><small>${a}</small><div>${b}</div></div>`;
 $("rs").textContent="60초 종료!";
 $("res").innerHTML=box("완성한 챔피언",idx+"명")+box("타자 수",keys+"타")+box("평균 타수",cpm+" 타/분")+box("오타 수",typos+"회")+box("정확도",acc.toFixed(1)+"%");
 show("result");
}
// 백스페이스: 조합 중인 글자는 통째로, 아니면 완성된 글자 1개 삭제. 지울 것이 있을 때만 오타 1회
function back(){
 if(!txt())return;
 if(l||v)l=v=null,t="";else cm=cm.slice(0,-1);
 typos++;draw();
}
document.addEventListener("keydown",e=>{
 if(scr==="lobby"&&e.code==="Enter"){start();return}
 if(scr!=="play"||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.code==="Escape"){e.preventDefault();clearInterval(iv);show("lobby");return}
 if(st&&performance.now()-st>=DUR*1000){finish();return}
 if(e.code==="Backspace"){e.preventDefault();back();return}
 if(e.code==="Enter"||e.code==="NumpadEnter"){e.preventDefault();if(!e.repeat&&txt()===target)next();return}
 if(e.code==="Space"){
  e.preventDefault();if(e.repeat||!txt())return;keys++;
  if(txt()===target)next();else{commit();cm+=" ";draw()}
  return;
 }
 const d=/^Digit(\d)$/.exec(e.code);
 if(d&&!e.shiftKey){e.preventDefault();begin();keys++;commit();cm+=d[1];draw();return}
 const k=K[e.code];
 if(k){e.preventDefault();begin();keys++;put(e.shiftKey&&k[1]?k[1]:k[0]);draw()}
});
$("go").onclick=start;$("again").onclick=start;
$("quit").onclick=()=>{clearInterval(iv);show("lobby")};
$("home").onclick=()=>show("lobby");
</script>
</body>
</html>
